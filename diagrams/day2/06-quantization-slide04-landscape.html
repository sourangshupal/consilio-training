<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The quantization landscape &middot; Tree</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#eb6c36;
      --font-sans:'Geist',system-ui,sans-serif; --font-serif:'Instrument Serif',serif; --font-mono:'Geist Mono',ui-monospace,monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:3rem 2rem; }
    .frame { max-width:1200px; width:100%; }
    .eyebrow { font-family:var(--font-mono); font-size:.66rem; font-weight:500; letter-spacing:.18em; text-transform:uppercase; color:var(--color-muted); margin-bottom:.5rem; }
    h1 { font-family:var(--font-serif); font-size:clamp(1.5rem,2.4vw + .75rem,2rem); font-weight:400; letter-spacing:-.02em; line-height:1.15; margin-bottom:1.5rem; }
    svg { width:100%; min-width:900px; display:block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Tree &middot; Diagram Design</p>
    <h1>The quantization landscape</h1>
    <svg viewBox="0 0 1000 440" xmlns="http://www.w3.org/2000/svg">
      <defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern></defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <text x="40" y="108" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.18em">TIER 0 &middot; ROOT</text>
      <text x="40" y="224" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.18em">TIER 1</text>
      <text x="40" y="352" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.18em">TIER 2 &middot; PTQ METHODS</text>

      <path d="M 500 128 L 500 168 L 260 168 L 260 208" fill="none" stroke="#4f5d75" stroke-width="1"/>
      <path d="M 500 168 L 740 168 L 740 208" fill="none" stroke="#4f5d75" stroke-width="1"/>

      <path d="M 260 272 L 260 296 L 130 296 L 130 336" fill="none" stroke="#4f5d75" stroke-width="1"/>
      <path d="M 260 296 L 260 336" fill="none" stroke="#4f5d75" stroke-width="1"/>
      <path d="M 260 296 L 390 296 L 390 336" fill="none" stroke="#4f5d75" stroke-width="1"/>
      <path d="M 260 296 L 520 296 L 520 336" fill="none" stroke="#4f5d75" stroke-width="1"/>

      <rect x="420" y="80" width="160" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="420" y="80" width="160" height="48" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="500" y="110" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Quantization</text>

      <rect x="160" y="208" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="160" y="208" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="260" y="236" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Post-Training (PTQ)</text>
      <text x="260" y="252" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">quantize after training</text>

      <rect x="640" y="208" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="640" y="208" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="740" y="236" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Quantization-Aware (QAT)</text>
      <text x="740" y="252" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">simulated during training</text>

      <rect x="75" y="336" width="110" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="75" y="336" width="110" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="130" y="364" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">GPTQ</text>

      <rect x="205" y="336" width="110" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="205" y="336" width="110" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="260" y="364" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">AWQ</text>

      <rect x="335" y="336" width="110" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="335" y="336" width="110" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="390" y="364" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">BNB NF4</text>

      <rect x="465" y="336" width="110" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="465" y="336" width="110" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="520" y="364" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">FP8</text>

      <line x1="40" y1="404" x2="960" y2="404" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="40" y="414" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="60" y="422" fill="#4f5d75" font-size="8.5" font-family="'Geist',sans-serif">Root</text>
      <rect x="140" y="414" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="160" y="422" fill="#4f5d75" font-size="8.5" font-family="'Geist',sans-serif">Approach</text>
      <rect x="280" y="414" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="300" y="422" fill="#4f5d75" font-size="8.5" font-family="'Geist',sans-serif">PTQ method</text>
      <text x="440" y="422" fill="#4f5d75" font-size="8.5" font-family="'Geist',sans-serif" font-style="italic">PTQ dominates practice &mdash; QAT is expensive and rarely worth it.</text>
    </svg>
  </div>
</body>
</html>
