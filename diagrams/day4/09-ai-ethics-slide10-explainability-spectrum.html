<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explainability techniques &middot; Spectrum</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#eb6c36;
      --font-sans:'Geist',system-ui,sans-serif; --font-serif:'Instrument Serif',serif; --font-mono:'Geist Mono',ui-monospace,monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:3rem 2rem; }
    .frame { max-width:1200px; width:100%; }
    .eyebrow { font-family:var(--font-mono); font-size:.66rem; font-weight:500; letter-spacing:.18em; text-transform:uppercase; color:var(--color-muted); margin-bottom:.5rem; }
    h1 { font-family:var(--font-serif); font-size:clamp(1.5rem,2.4vw + .75rem,2rem); font-weight:400; letter-spacing:-.02em; line-height:1.15; margin-bottom:1.5rem; }
    svg { width:100%; min-width:900px; display:block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Spectrum &middot; Diagram Design</p>
    <h1>Explainability techniques &mdash; a spectrum, not a switch</h1>
    <svg viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg">
      <defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern></defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <line x1="100" y1="180" x2="900" y2="180" stroke="#2d3142" stroke-width="1.2"/>
      <text x="100" y="204" fill="#2d3142" font-size="9" font-family="'Geist Mono',monospace" letter-spacing="0.1em">FULLY BLACK BOX</text>
      <text x="900" y="204" fill="#2d3142" font-size="9" font-family="'Geist Mono',monospace" text-anchor="end" letter-spacing="0.1em">FULLY INTERPRETABLE</text>

      <line x1="180" y1="174" x2="180" y2="186" stroke="#4f5d75" stroke-width="1"/>
      <circle cx="180" cy="180" r="5" fill="#ffffff" stroke="#4f5d75" stroke-width="1.2"/>
      <text x="180" y="150" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Raw deep net</text>
      <text x="180" y="164" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">no explanation</text>

      <line x1="400" y1="174" x2="400" y2="186" stroke="#eb6c36" stroke-width="1.2"/>
      <circle cx="400" cy="180" r="7" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="400" y="150" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Feature importance</text>
      <text x="400" y="164" fill="#eb6c36" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">SHAP &middot; LIME</text>

      <line x1="580" y1="174" x2="580" y2="186" stroke="#4f5d75" stroke-width="1"/>
      <circle cx="580" cy="180" r="5" fill="#ffffff" stroke="#4f5d75" stroke-width="1.2"/>
      <text x="580" y="230" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Self-explanation</text>
      <text x="580" y="244" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">chain-of-thought</text>

      <line x1="720" y1="174" x2="720" y2="186" stroke="#4f5d75" stroke-width="1"/>
      <circle cx="720" cy="180" r="5" fill="#ffffff" stroke="#4f5d75" stroke-width="1.2"/>
      <text x="720" y="150" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Model cards</text>
      <text x="720" y="164" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">documentation</text>

      <line x1="840" y1="174" x2="840" y2="186" stroke="#4f5d75" stroke-width="1"/>
      <circle cx="840" cy="180" r="5" fill="#ffffff" stroke="#4f5d75" stroke-width="1.2"/>
      <text x="840" y="230" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Decision tree</text>
      <text x="840" y="244" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">rule-based</text>

      <line x1="40" y1="272" x2="960" y2="272" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="288" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.18em">LEGEND</text>
      <circle cx="192" cy="294" r="7" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="208" y="298" fill="#4f5d75" font-size="8.5" font-family="'Geist',sans-serif">Most common in practice today</text>
      <text x="440" y="298" fill="#4f5d75" font-size="8.5" font-family="'Geist',sans-serif" font-style="italic">Self-explanations describe reasoning; they don't prove it caused the output.</text>
    </svg>
  </div>
</body>
</html>
