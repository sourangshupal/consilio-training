<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retries, cooldowns &amp; fallbacks &middot; Flowchart</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#eb6c36;
      --font-sans:'Geist',system-ui,sans-serif; --font-serif:'Instrument Serif',serif; --font-mono:'Geist Mono',ui-monospace,monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:3rem 2rem; }
    .frame { max-width:1200px; width:100%; }
    .eyebrow { font-family:var(--font-mono); font-size:.66rem; font-weight:500; letter-spacing:.18em; text-transform:uppercase; color:var(--color-muted); margin-bottom:.5rem; }
    h1 { font-family:var(--font-serif); font-size:clamp(1.5rem,2.4vw + .75rem,2rem); font-weight:400; letter-spacing:-.02em; line-height:1.15; margin-bottom:1.5rem; }
    svg { width:100%; min-width:900px; display:block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart &middot; Diagram Design</p>
    <h1>Retries, cooldowns &amp; fallbacks</h1>
    <svg viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <path d="M500,88 V128" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M500,192 V224" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M580,272 H760 V296" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M500,320 V344" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M760,352 V368 H580" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <path d="M600,168 V128" fill="none" stroke="none"/>
      <path d="M600,132 Q660,132 660,160 Q660,188 600,188" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <rect x="664" y="146" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="696" y="155" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.02em">RETRY &le;3&times;</text>

      <rect x="700" y="278" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="720" y="287" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">FAIL</text>
      <rect x="446" y="298" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="472" y="307" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">SUCCESS</text>

      <rect x="420" y="40" width="160" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="500" y="68" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Request</text>

      <rect x="420" y="128" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="420" y="128" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="156" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Model A</text>
      <text x="500" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">primary route</text>

      <polygon points="500,224 580,272 500,320 420,272" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="268" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">retries</text>
      <text x="500" y="282" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">exhausted?</text>

      <rect x="620" y="296" width="280" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="620" y="296" width="280" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="760" y="320" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Cooldown A + fallback to B</text>
      <text x="760" y="336" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono',monospace" text-anchor="middle">A rests, B serves the request</text>

      <rect x="420" y="344" width="160" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="500" y="372" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Response</text>
    </svg>
  </div>
</body>
</html>
