<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fairness definitions &middot; Comparison</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#eb6c36;
      --font-sans:'Geist',system-ui,sans-serif; --font-serif:'Instrument Serif',serif; --font-mono:'Geist Mono',ui-monospace,monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:3rem 2rem; }
    .frame { max-width:1200px; width:100%; }
    .eyebrow { font-family:var(--font-mono); font-size:.66rem; font-weight:500; letter-spacing:.18em; text-transform:uppercase; color:var(--color-muted); margin-bottom:.5rem; }
    h1 { font-family:var(--font-serif); font-size:clamp(1.5rem,2.4vw + .75rem,2rem); font-weight:400; letter-spacing:-.02em; line-height:1.15; margin-bottom:1.5rem; }
    svg { width:100%; min-width:900px; display:block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Comparison &middot; Diagram Design</p>
    <h1>Fairness definitions &mdash; one threshold can't satisfy both</h1>
    <svg viewBox="0 0 1000 420" xmlns="http://www.w3.org/2000/svg">
      <defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern></defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <text x="160" y="56" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.1em">GROUP A &middot; BASE RATE 70%</text>
      <text x="360" y="56" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.1em">GROUP B &middot; BASE RATE 40%</text>

      <rect x="120" y="90" width="80" height="200" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="120" y="150" width="80" height="140" fill="rgba(94,122,155,0.35)"/>
      <rect x="320" y="90" width="80" height="200" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="320" y="210" width="80" height="80" fill="rgba(124,143,111,0.35)"/>

      <line x1="90" y1="150" x2="430" y2="150" stroke="#2d3142" stroke-width="1.2" stroke-dasharray="5,4"/>
      <rect x="404" y="144" width="72" height="14" rx="2" fill="#f5f5f5"/>
      <text x="440" y="155" fill="#2d3142" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">THRESHOLD</text>

      <text x="160" y="310" fill="#2d3142" font-size="9" font-family="'Geist',sans-serif" text-anchor="middle">approved above line</text>
      <text x="360" y="310" fill="#2d3142" font-size="9" font-family="'Geist',sans-serif" text-anchor="middle">approved above line</text>

      <!-- Verdict panels -->
      <rect x="560" y="80" width="200" height="100" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="660" y="110" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Demographic Parity</text>
      <text x="660" y="128" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono',monospace" text-anchor="middle">equal selection rate</text>
      <text x="660" y="156" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">PASS</text>

      <rect x="800" y="80" width="200" height="100" rx="6" fill="#f5f5f5"/>
      <rect x="800" y="80" width="200" height="100" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="900" y="110" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Equalized Odds</text>
      <text x="900" y="128" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono',monospace" text-anchor="middle">equal error rates</text>
      <text x="900" y="156" fill="#eb6c36" font-size="13" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">FAIL</text>

      <line x1="40" y1="360" x2="960" y2="360" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="376" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.18em">LEGEND</text>
      <rect x="180" y="368" width="14" height="14" fill="rgba(94,122,155,0.35)"/>
      <text x="202" y="378" fill="#4f5d75" font-size="8.5" font-family="'Geist',sans-serif">Group A qualified</text>
      <rect x="340" y="368" width="14" height="14" fill="rgba(124,143,111,0.35)"/>
      <text x="362" y="378" fill="#4f5d75" font-size="8.5" font-family="'Geist',sans-serif">Group B qualified</text>
      <text x="540" y="378" fill="#4f5d75" font-size="8.5" font-family="'Geist',sans-serif" font-style="italic">Different base rates make both fairness criteria unsatisfiable at once.</text>
    </svg>
  </div>
</body>
</html>
