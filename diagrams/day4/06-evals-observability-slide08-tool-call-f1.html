<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tool Call F1 &middot; Comparison</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#eb6c36;
      --font-sans:'Geist',system-ui,sans-serif; --font-serif:'Instrument Serif',serif; --font-mono:'Geist Mono',ui-monospace,monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:3rem 2rem; }
    .frame { max-width:1200px; width:100%; }
    .eyebrow { font-family:var(--font-mono); font-size:.66rem; font-weight:500; letter-spacing:.18em; text-transform:uppercase; color:var(--color-muted); margin-bottom:.5rem; }
    h1 { font-family:var(--font-serif); font-size:clamp(1.5rem,2.4vw + .75rem,2rem); font-weight:400; letter-spacing:-.02em; line-height:1.15; margin-bottom:1.5rem; }
    svg { width:100%; min-width:900px; display:block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Comparison &middot; Diagram Design</p>
    <h1>Tool Call Accuracy vs. Tool Call F1 &mdash; same trajectory</h1>
    <svg viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg">
      <defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern></defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <rect x="48" y="72" width="420" height="280" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="150" y="76" width="216" height="12" rx="2" fill="#f5f5f5"/>
      <text x="258" y="85" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">TOOL CALL ACCURACY</text>

      <rect x="520" y="72" width="420" height="280" rx="8" fill="rgba(235,108,54,0.03)" stroke="rgba(235,108,54,0.20)" stroke-width="0.8"/>
      <rect x="670" y="76" width="140" height="12" rx="2" fill="#f5f5f5"/>
      <text x="740" y="85" fill="#eb6c36" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">TOOL CALL F1</text>

      <!-- Left: exact-order comparison, fails -->
      <text x="100" y="126" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono',monospace">EXPECTED</text>
      <rect x="200" y="112" width="90" height="28" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="245" y="130" fill="#2d3142" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">search()</text>
      <rect x="300" y="112" width="90" height="28" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="345" y="130" fill="#2d3142" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">summarize()</text>

      <text x="100" y="174" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono',monospace">ACTUAL</text>
      <rect x="200" y="160" width="90" height="28" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="245" y="178" fill="#2d3142" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">summarize()</text>
      <rect x="300" y="160" width="90" height="28" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="345" y="178" fill="#2d3142" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">search()</text>

      <text x="258" y="214" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">SAME TOOLS, SWAPPED ORDER</text>

      <rect x="158" y="264" width="200" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="258" y="292" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">FAIL</text>
      <text x="258" y="308" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono',monospace" text-anchor="middle">exact-sequence match = 0</text>

      <!-- Right: set comparison, high score -->
      <text x="580" y="126" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono',monospace">EXPECTED</text>
      <rect x="672" y="112" width="90" height="28" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="717" y="130" fill="#2d3142" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">search()</text>
      <rect x="772" y="112" width="90" height="28" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="817" y="130" fill="#2d3142" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">summarize()</text>

      <text x="580" y="174" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono',monospace">ACTUAL</text>
      <rect x="672" y="160" width="90" height="28" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="717" y="178" fill="#2d3142" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">summarize()</text>
      <rect x="772" y="160" width="90" height="28" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="817" y="178" fill="#2d3142" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">search()</text>

      <text x="740" y="214" fill="#eb6c36" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">SAME TOOLS + PARAMS, ORDER IGNORED</text>

      <rect x="640" y="264" width="200" height="60" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="740" y="292" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">F1 = 1.0</text>
      <text x="740" y="308" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono',monospace" text-anchor="middle">precision &amp; recall both perfect</text>

      <line x1="40" y1="368" x2="960" y2="368" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="500" y="384" fill="#4f5d75" font-size="8.5" font-family="'Geist',sans-serif" font-style="italic" text-anchor="middle">Exact-match accuracy punishes a harmless reordering; F1 doesn't.</text>
    </svg>
  </div>
</body>
</html>
