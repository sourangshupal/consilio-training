<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choosing a pattern &middot; Comparison</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#eb6c36;
      --font-sans:'Geist',system-ui,sans-serif; --font-serif:'Instrument Serif',serif; --font-mono:'Geist Mono',ui-monospace,monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:3rem 2rem; }
    .frame { max-width:1200px; width:100%; }
    .eyebrow { font-family:var(--font-mono); font-size:.66rem; font-weight:500; letter-spacing:.18em; text-transform:uppercase; color:var(--color-muted); margin-bottom:.5rem; }
    h1 { font-family:var(--font-serif); font-size:clamp(1.5rem,2.4vw + .75rem,2rem); font-weight:400; letter-spacing:-.02em; line-height:1.15; margin-bottom:1.5rem; }
    svg { width:100%; min-width:900px; display:block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Comparison &middot; Diagram Design</p>
    <h1>Choosing a multi-agent pattern</h1>
    <svg viewBox="0 0 1000 380" xmlns="http://www.w3.org/2000/svg">
      <defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern></defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- Sequential -->
      <rect x="40" y="60" width="210" height="220" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="145" y="84" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Sequential</text>
      <circle cx="90" cy="160" r="8" fill="#ffffff" stroke="#4f5d75" stroke-width="1.2"/>
      <circle cx="145" cy="160" r="8" fill="#ffffff" stroke="#4f5d75" stroke-width="1.2"/>
      <circle cx="200" cy="160" r="8" fill="#ffffff" stroke="#4f5d75" stroke-width="1.2"/>
      <line x1="98" y1="160" x2="137" y2="160" stroke="#4f5d75" stroke-width="1"/>
      <line x1="153" y1="160" x2="192" y2="160" stroke="#4f5d75" stroke-width="1"/>
      <text x="145" y="240" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono',monospace" text-anchor="middle">linear chain</text>
      <text x="145" y="254" fill="#4f5d75" font-size="8" font-family="'Geist',sans-serif" text-anchor="middle">A &rarr; B &rarr; C, fixed order</text>

      <!-- Orchestrator-Worker -->
      <rect x="270" y="60" width="210" height="220" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="375" y="84" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Orchestrator-Worker</text>
      <circle cx="375" cy="140" r="9" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="1.2"/>
      <circle cx="330" cy="190" r="7" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
      <circle cx="375" cy="190" r="7" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
      <circle cx="420" cy="190" r="7" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
      <line x1="368" y1="147" x2="336" y2="183" stroke="#4f5d75" stroke-width="1"/>
      <line x1="375" y1="149" x2="375" y2="183" stroke="#4f5d75" stroke-width="1"/>
      <line x1="382" y1="147" x2="414" y2="183" stroke="#4f5d75" stroke-width="1"/>
      <text x="375" y="240" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono',monospace" text-anchor="middle">hub + spokes</text>
      <text x="375" y="254" fill="#4f5d75" font-size="8" font-family="'Geist',sans-serif" text-anchor="middle">parallel, results merged</text>

      <!-- Hierarchical / Supervisor -->
      <rect x="500" y="60" width="210" height="220" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="605" y="84" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Hierarchical</text>
      <circle cx="605" cy="130" r="8" fill="#ffffff" stroke="#4f5d75" stroke-width="1.2"/>
      <circle cx="565" cy="180" r="7" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
      <circle cx="645" cy="180" r="7" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
      <circle cx="620" cy="220" r="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
      <line x1="600" y1="137" x2="569" y2="174" stroke="#4f5d75" stroke-width="1"/>
      <line x1="610" y1="137" x2="641" y2="174" stroke="#4f5d75" stroke-width="1"/>
      <line x1="648" y1="186" x2="623" y2="215" stroke="#4f5d75" stroke-width="1"/>
      <text x="605" y="240" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono',monospace" text-anchor="middle">multi-level tree</text>
      <text x="605" y="254" fill="#4f5d75" font-size="8" font-family="'Geist',sans-serif" text-anchor="middle">supervisors delegate down</text>

      <!-- Dynamic Handoff -->
      <rect x="730" y="60" width="210" height="220" rx="6" fill="rgba(235,108,54,0.03)" stroke="#eb6c36" stroke-width="1"/>
      <text x="835" y="84" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Dynamic Handoff</text>
      <circle cx="795" cy="170" r="8" fill="#ffffff" stroke="#4f5d75" stroke-width="1.2"/>
      <circle cx="875" cy="170" r="8" fill="#ffffff" stroke="#4f5d75" stroke-width="1.2"/>
      <circle cx="835" cy="220" r="8" fill="#ffffff" stroke="#4f5d75" stroke-width="1.2"/>
      <path d="M 802,166 Q 835,140 868,166" fill="none" stroke="#eb6c36" stroke-width="1" stroke-dasharray="3,3"/>
      <path d="M 800,178 Q 815,205 828,214" fill="none" stroke="#eb6c36" stroke-width="1" stroke-dasharray="3,3"/>
      <text x="835" y="240" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono',monospace" text-anchor="middle">runtime-routed</text>
      <text x="835" y="254" fill="#4f5d75" font-size="8" font-family="'Geist',sans-serif" text-anchor="middle">any agent hands off next</text>

      <line x1="40" y1="308" x2="960" y2="308" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="324" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.18em">LEGEND</text>
      <text x="180" y="324" fill="#4f5d75" font-size="8.5" font-family="'Geist',sans-serif" font-style="italic">Topology follows task shape &mdash; parallel work wants a hub, escalation wants a tree.</text>
    </svg>
  </div>
</body>
</html>
