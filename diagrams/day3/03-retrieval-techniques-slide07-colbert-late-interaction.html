<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ColBERT late-interaction &middot; Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#eb6c36;
      --font-sans:'Geist',system-ui,sans-serif; --font-serif:'Instrument Serif',serif; --font-mono:'Geist Mono',ui-monospace,monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:3rem 2rem; }
    .frame { max-width:1200px; width:100%; }
    .eyebrow { font-family:var(--font-mono); font-size:.66rem; font-weight:500; letter-spacing:.18em; text-transform:uppercase; color:var(--color-muted); margin-bottom:.5rem; }
    h1 { font-family:var(--font-serif); font-size:clamp(1.5rem,2.4vw + .75rem,2rem); font-weight:400; letter-spacing:-.02em; line-height:1.15; margin-bottom:1.5rem; }
    svg { width:100%; min-width:900px; display:block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture &middot; Diagram Design</p>
    <h1>ColBERT &mdash; late interaction via MaxSim</h1>
    <svg viewBox="0 0 1000 440" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <text x="180" y="64" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">QUERY TOKEN VECTORS</text>
      <text x="740" y="44" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">DOCUMENT TOKEN VECTORS</text>

      <path d="M240,132 H400 Q440,132 440,172 V180 Q440,220 480,220 H640" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <path d="M240,228 H480 V240 H640" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <path d="M240,324 H400 Q440,324 440,300 V300 Q440,296 480,296 H640" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

      <rect x="360" y="176" width="60" height="12" rx="2" fill="#f5f5f5"/>
      <text x="390" y="185" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.04em">MAXSIM</text>

      <!-- Query tokens -->
      <rect x="120" y="100" width="120" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="120" y="100" width="120" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="180" y="136" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Q1: "governed"</text>

      <rect x="120" y="196" width="120" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="120" y="196" width="120" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="180" y="232" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Q2: "by"</text>

      <rect x="120" y="292" width="120" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="120" y="292" width="120" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="180" y="328" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Q3: "Delaware"</text>

      <!-- Doc tokens -->
      <rect x="640" y="60" width="120" height="52" rx="6" fill="#f5f5f5"/>
      <rect x="640" y="60" width="120" height="52" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="700" y="90" fill="#4f5d75" font-size="10" font-family="'Geist',sans-serif" text-anchor="middle">D1: "This"</text>

      <rect x="640" y="196" width="120" height="52" rx="6" fill="#f5f5f5"/>
      <rect x="640" y="196" width="120" height="52" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="700" y="226" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">D2: "governed"</text>

      <rect x="640" y="264" width="120" height="52" rx="6" fill="#f5f5f5"/>
      <rect x="640" y="264" width="120" height="52" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="700" y="294" fill="#4f5d75" font-size="10" font-family="'Geist',sans-serif" text-anchor="middle">D3: "by"</text>

      <rect x="640" y="332" width="120" height="52" rx="6" fill="#f5f5f5"/>
      <rect x="640" y="332" width="120" height="52" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="700" y="362" fill="#4f5d75" font-size="10" font-family="'Geist',sans-serif" text-anchor="middle">D4: "Delaware"</text>

      <line x1="40" y1="404" x2="960" y2="404" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="420" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.18em">LEGEND</text>
      <rect x="180" y="412" width="24" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="212" y="422" fill="#4f5d75" font-size="8.5" font-family="'Geist',sans-serif">Strongest match</text>
      <line x1="380" y1="418" x2="408" y2="418" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <text x="416" y="422" fill="#4f5d75" font-size="8.5" font-family="'Geist',sans-serif">MaxSim per query token</text>
      <text x="620" y="422" fill="#4f5d75" font-size="8.5" font-family="'Geist',sans-serif" font-style="italic">Every query token keeps its own vector &mdash; nothing gets pooled.</text>
    </svg>
  </div>
</body>
</html>
