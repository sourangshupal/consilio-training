<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRAG mechanics &middot; Flowchart</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#eb6c36;
      --font-sans:'Geist',system-ui,sans-serif; --font-serif:'Instrument Serif',serif; --font-mono:'Geist Mono',ui-monospace,monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:3rem 2rem; }
    .frame { max-width:1200px; width:100%; }
    .eyebrow { font-family:var(--font-mono); font-size:.66rem; font-weight:500; letter-spacing:.18em; text-transform:uppercase; color:var(--color-muted); margin-bottom:.5rem; }
    h1 { font-family:var(--font-serif); font-size:clamp(1.5rem,2.4vw + .75rem,2rem); font-weight:400; letter-spacing:-.02em; line-height:1.15; margin-bottom:1.5rem; }
    svg { width:100%; min-width:900px; display:block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart &middot; Diagram Design</p>
    <h1>CRAG &mdash; grade first, then decide how to use it</h1>
    <svg viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <path d="M500,88 V116" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M440,176 H250 V212" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M500,204 V212" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M560,176 H750 V212" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="180" y="188" width="46" height="12" rx="2" fill="#f5f5f5"/>
      <text x="203" y="197" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">CORRECT</text>
      <rect x="545" y="188" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="585" y="197" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">AMBIGUOUS</text>
      <rect x="692" y="188" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="728" y="197" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">INCORRECT</text>

      <path d="M250,276 V308 H430 V332" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M500,276 V332" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M750,276 V308 H570 V332" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M500,388 V412" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <rect x="420" y="40" width="160" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="500" y="68" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Retrieved doc</text>

      <polygon points="500,116 590,160 500,204 410,160" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="156" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Evaluator</text>
      <text x="500" y="170" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">grades relevance</text>

      <rect x="140" y="212" width="220" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="140" y="212" width="220" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="250" y="238" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Refine &amp; use</text>
      <text x="250" y="254" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono',monospace" text-anchor="middle">strip noise from chunk</text>
      <text x="250" y="266" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono',monospace" text-anchor="middle">high confidence</text>

      <rect x="390" y="212" width="220" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="390" y="212" width="220" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="238" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Combine + web search</text>
      <text x="500" y="254" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono',monospace" text-anchor="middle">partial trust, supplement</text>
      <text x="500" y="266" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono',monospace" text-anchor="middle">with external search</text>

      <rect x="640" y="212" width="220" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="640" y="212" width="220" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="750" y="238" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Discard + web search</text>
      <text x="750" y="254" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono',monospace" text-anchor="middle">chunk not trusted</text>
      <text x="750" y="266" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono',monospace" text-anchor="middle">replace with search results</text>

      <circle cx="500" cy="376" r="4" fill="#2d3142"/>

      <rect x="380" y="412" width="240" height="56" rx="28" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="500" y="444" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Generation</text>

      <line x1="40" y1="488" x2="960" y2="488" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="504" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.18em">LEGEND</text>
      <polygon points="188,494 200,488 212,494 200,500" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="224" y="498" fill="#4f5d75" font-size="8.5" font-family="'Geist',sans-serif">3-way grade (decision)</text>
      <text x="420" y="498" fill="#4f5d75" font-size="8.5" font-family="'Geist',sans-serif" font-style="italic">Every path still generates &mdash; only the input to generation changes.</text>
    </svg>
  </div>
</body>
</html>
