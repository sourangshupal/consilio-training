<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The full retrieval pipeline &middot; Flowchart</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#eb6c36;
      --font-sans:'Geist',system-ui,sans-serif; --font-serif:'Instrument Serif',serif; --font-mono:'Geist Mono',ui-monospace,monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:3rem 2rem; }
    .frame { max-width:1200px; width:100%; }
    .eyebrow { font-family:var(--font-mono); font-size:.66rem; font-weight:500; letter-spacing:.18em; text-transform:uppercase; color:var(--color-muted); margin-bottom:.5rem; }
    h1 { font-family:var(--font-serif); font-size:clamp(1.5rem,2.4vw + .75rem,2rem); font-weight:400; letter-spacing:-.02em; line-height:1.15; margin-bottom:1.5rem; }
    svg { width:100%; min-width:900px; display:block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart &middot; Diagram Design</p>
    <h1>Putting it together &mdash; the full retrieval pipeline</h1>
    <svg viewBox="0 0 1000 200" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <path d="M132,76 H144" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M280,76 H292" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M448,76 H460" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M580,76 H592" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M728,76 H740" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M876,76 H888" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <rect x="16" y="48" width="116" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="16" y="48" width="116" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="74" y="72" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Raw Query</text>
      <text x="74" y="88" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono',monospace" text-anchor="middle">user input</text>

      <rect x="144" y="48" width="136" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="144" y="48" width="136" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="212" y="72" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Query Transform</text>
      <text x="212" y="88" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono',monospace" text-anchor="middle">rewrite / expand</text>

      <rect x="292" y="48" width="156" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="292" y="48" width="156" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="370" y="72" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Hybrid Retrieval</text>
      <text x="370" y="88" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono',monospace" text-anchor="middle">dense + sparse, RRF</text>

      <rect x="460" y="48" width="120" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="460" y="48" width="120" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="520" y="72" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Top-K</text>
      <text x="520" y="88" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono',monospace" text-anchor="middle">candidate set</text>

      <rect x="592" y="48" width="136" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="592" y="48" width="136" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="660" y="72" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Reranker</text>
      <text x="660" y="88" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono',monospace" text-anchor="middle">cross-encoder</text>

      <rect x="740" y="48" width="136" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="740" y="48" width="136" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="808" y="72" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Final Top-N</text>
      <text x="808" y="88" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono',monospace" text-anchor="middle">context window</text>

      <rect x="888" y="48" width="96" height="56" rx="28" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="936" y="72" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">LLM</text>
      <text x="936" y="88" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono',monospace" text-anchor="middle">generation</text>

      <text x="500" y="140" fill="#4f5d75" font-size="8.5" font-family="'Geist',sans-serif" font-style="italic" text-anchor="middle">Each stage narrows the candidate set &mdash; retrieval is cheap and broad, reranking is expensive and precise.</text>
    </svg>
  </div>
</body>
</html>
