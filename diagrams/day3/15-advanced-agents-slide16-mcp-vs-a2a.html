<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCP vs. A2A &middot; Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#eb6c36;
      --font-sans:'Geist',system-ui,sans-serif; --font-serif:'Instrument Serif',serif; --font-mono:'Geist Mono',ui-monospace,monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:3rem 2rem; }
    .frame { max-width:1200px; width:100%; }
    .eyebrow { font-family:var(--font-mono); font-size:.66rem; font-weight:500; letter-spacing:.18em; text-transform:uppercase; color:var(--color-muted); margin-bottom:.5rem; }
    h1 { font-family:var(--font-serif); font-size:clamp(1.5rem,2.4vw + .75rem,2rem); font-weight:400; letter-spacing:-.02em; line-height:1.15; margin-bottom:1.5rem; }
    svg { width:100%; min-width:900px; display:block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture &middot; Diagram Design</p>
    <h1>MCP vs. A2A &mdash; complementary, not competing</h1>
    <svg viewBox="0 0 1000 440" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <rect x="48" y="72" width="420" height="320" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="200" y="76" width="116" height="12" rx="2" fill="#f5f5f5"/>
      <text x="258" y="85" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">MCP &middot; VERTICAL</text>

      <rect x="520" y="72" width="420" height="320" rx="8" fill="rgba(235,108,54,0.03)" stroke="rgba(235,108,54,0.20)" stroke-width="0.8"/>
      <rect x="670" y="76" width="140" height="12" rx="2" fill="#f5f5f5"/>
      <text x="740" y="85" fill="#eb6c36" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">A2A &middot; HORIZONTAL</text>

      <path d="M258,148 V172" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M180,236 V260" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M258,236 V260" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M336,236 V260" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M120,172 H180 V236" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M396,172 H336 V236" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="188" y="108" width="140" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="188" y="108" width="140" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="258" y="144" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Agent</text>

      <rect x="140" y="172" width="80" height="20" fill="none"/>
      <rect x="130" y="236" width="100" height="52" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="180" y="266" fill="#2d3142" font-size="10" font-family="'Geist',sans-serif" text-anchor="middle">Tool 1</text>

      <rect x="208" y="236" width="100" height="52" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="258" y="266" fill="#2d3142" font-size="10" font-family="'Geist',sans-serif" text-anchor="middle">Tool 2</text>

      <rect x="286" y="236" width="100" height="52" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="336" y="266" fill="#2d3142" font-size="10" font-family="'Geist',sans-serif" text-anchor="middle">Tool 3</text>

      <text x="258" y="336" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">ONE AGENT, MANY TOOLS BELOW IT</text>

      <path d="M636,196 H844" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <path d="M844,214 H636" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <rect x="596" y="164" width="140" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="596" y="164" width="140" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="666" y="200" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Agent A</text>

      <rect x="744" y="164" width="140" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="744" y="164" width="140" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="814" y="200" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Agent B</text>

      <text x="740" y="336" fill="#eb6c36" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">PEER AGENTS, SAME LEVEL</text>

      <line x1="40" y1="416" x2="960" y2="416" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="500" y="432" fill="#4f5d75" font-size="8.5" font-family="'Geist',sans-serif" font-style="italic" text-anchor="middle">MCP gives an agent tools. A2A lets two agents talk. Most systems need both.</text>
    </svg>
  </div>
</body>
</html>
