<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The ColPali paradigm &middot; Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#eb6c36;
      --font-sans:'Geist',system-ui,sans-serif; --font-serif:'Instrument Serif',serif; --font-mono:'Geist Mono',ui-monospace,monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:3rem 2rem; }
    .frame { max-width:1200px; width:100%; }
    .eyebrow { font-family:var(--font-mono); font-size:.66rem; font-weight:500; letter-spacing:.18em; text-transform:uppercase; color:var(--color-muted); margin-bottom:.5rem; }
    h1 { font-family:var(--font-serif); font-size:clamp(1.5rem,2.4vw + .75rem,2rem); font-weight:400; letter-spacing:-.02em; line-height:1.15; margin-bottom:1.5rem; }
    svg { width:100%; min-width:900px; display:block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture &middot; Diagram Design</p>
    <h1>The ColPali paradigm &mdash; skipping OCR entirely</h1>
    <svg viewBox="0 0 1000 460" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <rect x="48" y="72" width="420" height="360" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="170" y="76" width="176" height="12" rx="2" fill="#f5f5f5"/>
      <text x="258" y="85" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">TRADITIONAL PIPELINE</text>

      <rect x="520" y="72" width="420" height="360" rx="8" fill="rgba(235,108,54,0.03)" stroke="rgba(235,108,54,0.20)" stroke-width="0.8"/>
      <rect x="670" y="76" width="140" height="12" rx="2" fill="#f5f5f5"/>
      <text x="740" y="85" fill="#eb6c36" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">COLPALI PIPELINE</text>

      <path d="M258,148 V168" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M258,228 V248" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M258,308 V328" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M258,388 V400" fill="none" stroke="none"/>

      <path d="M740,148 V208" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <rect x="188" y="108" width="140" height="40" rx="6" fill="#f5f5f5"/>
      <rect x="188" y="108" width="140" height="40" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="258" y="132" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Page</text>

      <rect x="188" y="168" width="140" height="60" rx="6" fill="#f5f5f5"/>
      <rect x="188" y="168" width="140" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="258" y="194" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Layout Detection</text>
      <text x="258" y="210" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">bounding boxes</text>

      <rect x="188" y="248" width="140" height="60" rx="6" fill="#f5f5f5"/>
      <rect x="188" y="248" width="140" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="258" y="274" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">OCR</text>
      <text x="258" y="290" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">text extraction</text>

      <rect x="188" y="328" width="140" height="60" rx="6" fill="#f5f5f5"/>
      <rect x="188" y="328" width="140" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="258" y="354" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Text Chunks</text>
      <text x="258" y="370" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">&rarr; Embedding</text>

      <rect x="670" y="108" width="140" height="40" rx="6" fill="#f5f5f5"/>
      <rect x="670" y="108" width="140" height="40" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="740" y="132" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Page</text>

      <rect x="670" y="208" width="140" height="60" rx="6" fill="#f5f5f5"/>
      <rect x="670" y="208" width="140" height="60" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="740" y="234" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Vision-Language Model</text>
      <text x="740" y="250" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">sees the page as an image</text>

      <path d="M740,268 V288" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <rect x="670" y="288" width="140" height="60" rx="6" fill="#f5f5f5"/>
      <rect x="670" y="288" width="140" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="740" y="314" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Page Patch</text>
      <text x="740" y="330" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">Embeddings</text>

      <text x="740" y="388" fill="#eb6c36" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">NO OCR STEP</text>

      <line x1="40" y1="440" x2="960" y2="440" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="456" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.18em">LEGEND</text>
      <rect x="180" y="448" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="212" y="458" fill="#4f5d75" font-size="8.5" font-family="'Geist',sans-serif">Text-extraction step</text>
      <rect x="380" y="448" width="24" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="412" y="458" fill="#4f5d75" font-size="8.5" font-family="'Geist',sans-serif">Vision-native step</text>
      <text x="580" y="458" fill="#4f5d75" font-size="8.5" font-family="'Geist',sans-serif" font-style="italic">Tables and figures survive when nothing gets flattened to text first.</text>
    </svg>
  </div>
</body>
</html>
