<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAGAS faithfulness &middot; Flowchart</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#eb6c36;
      --font-sans:'Geist',system-ui,sans-serif; --font-serif:'Instrument Serif',serif; --font-mono:'Geist Mono',ui-monospace,monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:3rem 2rem; }
    .frame { max-width:1200px; width:100%; }
    .eyebrow { font-family:var(--font-mono); font-size:.66rem; font-weight:500; letter-spacing:.18em; text-transform:uppercase; color:var(--color-muted); margin-bottom:.5rem; }
    h1 { font-family:var(--font-serif); font-size:clamp(1.5rem,2.4vw + .75rem,2rem); font-weight:400; letter-spacing:-.02em; line-height:1.15; margin-bottom:1.5rem; }
    svg { width:100%; min-width:900px; display:block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart &middot; Diagram Design</p>
    <h1>RAGAS faithfulness &mdash; claim by claim</h1>

      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <path d="M440,88 V108 H180 V140" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M500,88 V140" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M560,88 V108 H820 V140" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <path d="M820,204 V236" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <path d="M180,300 V332 H430 V360" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M500,300 V360" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M820,300 V332 H570 V360" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <path d="M500,416 V440" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <rect x="420" y="40" width="160" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="500" y="68" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Generated answer</text>

      <rect x="80" y="140" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="180" y="168" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Claim 1</text>
      <text x="180" y="184" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono',monospace" text-anchor="middle">decomposed statement</text>

      <rect x="400" y="140" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="400" y="140" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="168" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Claim 2</text>
      <text x="500" y="184" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono',monospace" text-anchor="middle">decomposed statement</text>

      <rect x="720" y="140" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="720" y="140" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="820" y="168" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Claim 3</text>
      <text x="820" y="184" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono',monospace" text-anchor="middle">decomposed statement</text>

      <rect x="80" y="236" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="80" y="236" width="200" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="180" y="264" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Check vs. context</text>
      <text x="180" y="280" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono',monospace" text-anchor="middle">supported? yes / no</text>

      <rect x="400" y="236" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="400" y="236" width="200" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="500" y="264" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Check vs. context</text>
      <text x="500" y="280" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono',monospace" text-anchor="middle">supported? yes / no</text>

      <rect x="720" y="236" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="720" y="236" width="200" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="820" y="264" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Check vs. context</text>
      <text x="820" y="280" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono',monospace" text-anchor="middle">supported? yes / no</text>

      <rect x="360" y="360" width="280" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="360" y="360" width="280" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="384" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Aggregate</text>
      <text x="500" y="400" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">supported claims / total claims</text>

      <rect x="380" y="440" width="240" height="56" rx="28" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="500" y="472" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Faithfulness score</text>
    </svg>
  </div>
</body>
</html>
