<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vanilla RAG architecture &middot; Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#eb6c36;
      --font-sans:'Geist',system-ui,sans-serif; --font-serif:'Instrument Serif',serif; --font-mono:'Geist Mono',ui-monospace,monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:3rem 2rem; }
    .frame { max-width:1200px; width:100%; }
    .eyebrow { font-family:var(--font-mono); font-size:.66rem; font-weight:500; letter-spacing:.18em; text-transform:uppercase; color:var(--color-muted); margin-bottom:.5rem; }
    h1 { font-family:var(--font-serif); font-size:clamp(1.5rem,2.4vw + .75rem,2rem); font-weight:400; letter-spacing:-.02em; line-height:1.15; margin-bottom:1.5rem; }
    svg { width:100%; min-width:900px; display:block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture &middot; Diagram Design</p>
    <h1>Vanilla RAG &mdash; ingestion and query, two phases</h1>
    <svg viewBox="0 0 1000 440" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <text x="60" y="76" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.18em">INGESTION</text>
      <text x="60" y="284" fill="#eb6c36" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.18em">QUERY</text>

      <!-- Ingestion row -->
      <path d="M180,104 H220" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M400,104 H440" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M620,104 H660" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="60" y="80" width="120" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="60" y="80" width="120" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="120" y="108" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Documents</text>

      <rect x="220" y="80" width="180" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="220" y="80" width="180" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="310" y="108" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Chunking</text>

      <rect x="440" y="80" width="180" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="440" y="80" width="180" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="530" y="108" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Embedding Model</text>

      <!-- Query row -->
      <path d="M180,312 H220" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <path d="M400,312 H440" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <path d="M760,312 H820" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

      <rect x="60" y="288" width="120" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="60" y="288" width="120" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="120" y="316" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Question</text>

      <rect x="220" y="288" width="180" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="220" y="288" width="180" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="310" y="316" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Embedding</text>

      <rect x="620" y="288" width="140" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="620" y="288" width="140" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="690" y="316" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Retrieved Chunks</text>

      <rect x="820" y="288" width="120" height="48" rx="24" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="880" y="316" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Answer (LLM)</text>

      <!-- Shared Vector DB -->
      <path d="M530,128 V152 Q530,160 538,160 H600 Q608,160 608,168 V216" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M608,264 V232" fill="none" stroke="none"/>
      <path d="M400,312 H480 Q488,312 488,304 V232 Q488,224 496,224 H586" fill="none" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>

      <rect x="608" y="168" width="180" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="608" y="168" width="180" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="698" y="192" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Vector DB</text>
      <text x="698" y="208" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">shared store</text>

      <path d="M698,224 V264 Q698,272 690,272 H770 Q778,272 778,280 V288" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

      <line x1="40" y1="368" x2="960" y2="368" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="384" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.18em">LEGEND</text>
      <line x1="180" y1="392" x2="208" y2="392" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="216" y="396" fill="#4f5d75" font-size="8.5" font-family="'Geist',sans-serif">Ingestion path</text>
      <line x1="360" y1="392" x2="388" y2="392" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="396" y="396" fill="#4f5d75" font-size="8.5" font-family="'Geist',sans-serif">Query path</text>
      <text x="560" y="396" fill="#4f5d75" font-size="8.5" font-family="'Geist',sans-serif" font-style="italic">Both phases write to and read from the same vector store.</text>
    </svg>
  </div>
</body>
</html>
