<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flash Attention memory I/O &middot; Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture &middot; Diagram Design</p>
    <h1>Flash Attention &mdash; fewer trips between HBM and SRAM</h1>

    <svg viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- Zones -->
        <rect x="48" y="112" width="420" height="320" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="150" y="116" width="216" height="12" rx="2" fill="#f5f5f5"/>
        <text x="258" y="125" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">STANDARD ATTENTION</text>

        <rect x="520" y="112" width="420" height="320" rx="8" fill="rgba(235,108,54,0.03)" stroke="rgba(235,108,54,0.20)" stroke-width="0.8"/>
        <rect x="628" y="116" width="212" height="12" rx="2" fill="#f5f5f5"/>
        <text x="734" y="125" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">FLASH ATTENTION</text>

        <!-- Standard: many round trips (behind boxes) -->
        <line x1="150" y1="216" x2="150" y2="352" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <line x1="200" y1="216" x2="200" y2="352" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <line x1="250" y1="216" x2="250" y2="352" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <line x1="316" y1="352" x2="316" y2="216" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <line x1="366" y1="352" x2="366" y2="216" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

        <rect x="94" y="278" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="120" y="287" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">READ N&sup2;</text>
        <rect x="330" y="278" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="358" y="287" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">WRITE N&sup2;</text>

        <!-- Flash: single trip in, single trip out -->
        <line x1="698" y1="216" x2="698" y2="352" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <line x1="858" y1="352" x2="858" y2="216" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <path d="M 660,352 Q 778,304 896,352" fill="none" stroke="#eb6c36" stroke-width="1" stroke-dasharray="4,3"/>

        <rect x="668" y="278" width="60" height="12" rx="2" fill="#f5f5f5"/>
        <text x="698" y="287" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">LOAD TILE</text>
        <rect x="826" y="278" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="858" y="287" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">WRITE OUT</text>
        <rect x="742" y="332" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="778" y="341" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">TILED LOOP</text>

        <!-- HBM / SRAM boxes: standard -->
        <rect x="88" y="152" width="340" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="88" y="152" width="340" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="258" y="178" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">HBM</text>
        <text x="258" y="194" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">high bandwidth &middot; slow</text>

        <rect x="88" y="352" width="340" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="88" y="352" width="340" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="258" y="378" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SRAM</text>
        <text x="258" y="394" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">on-chip &middot; fast &middot; small</text>

        <!-- HBM / SRAM boxes: flash -->
        <rect x="608" y="152" width="340" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="608" y="152" width="340" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="778" y="178" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">HBM</text>
        <text x="778" y="194" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">high bandwidth &middot; slow</text>

        <rect x="608" y="352" width="340" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="608" y="352" width="340" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <text x="778" y="378" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SRAM</text>
        <text x="778" y="394" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">tiled block stays resident</text>

        <!-- Legend -->
        <line x1="40" y1="452" x2="960" y2="452" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="468" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <line x1="40" y1="480" x2="68" y2="480" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <text x="76" y="484" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Full N&sup2; round trip</text>

        <line x1="300" y1="480" x2="328" y2="480" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="336" y="484" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Single tile trip</text>

        <text x="540" y="484" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif" font-style="italic">Standard attention shuttles the full matrix; Flash keeps tiles in SRAM.</text>
      </svg>
  </div>
</body>
</html>
