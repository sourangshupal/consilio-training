<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choosing the right model &middot; Quadrant</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Quadrant &middot; Diagram Design</p>
    <h1>Choosing the right model &mdash; accuracy vs. cost/latency</h1>

    <svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- Focal quadrant tint: top-left, sweet spot -->
        <rect x="120" y="80" width="380" height="170" fill="rgba(235,108,54,0.03)"/>

        <!-- Axis cross -->
        <line x1="120" y1="250" x2="880" y2="250" stroke="rgba(45,49,66,0.45)" stroke-width="1"/>
        <line x1="500" y1="80" x2="500" y2="420" stroke="rgba(45,49,66,0.45)" stroke-width="1"/>

        <!-- Axis tip labels: Jobs-minimal, one word, no glyphs -->
        <text x="500" y="68" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.18em">ACCURATE</text>
        <text x="500" y="440" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.18em">BASIC</text>
        <text x="108" y="254" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.18em">FAST</text>
        <text x="892" y="254" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">SLOW</text>

        <!-- Quadrant corner labels -->
        <text x="140" y="104" fill="#eb6c36" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em" font-weight="600">SWEET SPOT</text>
        <text x="860" y="104" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.18em">FRONTIER</text>
        <text x="140" y="412" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LIGHTWEIGHT</text>
        <text x="860" y="412" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.18em">AVOID</text>

        <!-- Items: TL sweet spot (focal) -->
        <circle cx="240" cy="150" r="6" fill="#eb6c36"/>
        <text x="252" y="154" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Fine-tuned small model</text>

        <!-- Items: TR frontier -->
        <circle cx="700" cy="140" r="4" fill="#2d3142"/>
        <text x="712" y="144" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">Frontier reasoning model</text>

        <!-- Items: BL lightweight -->
        <circle cx="260" cy="340" r="4" fill="#2d3142"/>
        <text x="272" y="344" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">Small open model (1-3B)</text>

        <!-- Items: BR avoid -->
        <circle cx="700" cy="360" r="4" fill="#2d3142"/>
        <text x="712" y="364" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">Oversized model, simple task</text>

        <!-- Legend -->
        <line x1="40" y1="456" x2="960" y2="456" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="472" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <circle cx="52" cy="488" r="6" fill="#eb6c36"/>
        <text x="68" y="492" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Best-fit default</text>

        <circle cx="220" cy="488" r="4" fill="#2d3142"/>
        <text x="236" y="492" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Candidate category</text>

        <text x="400" y="492" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif" font-style="italic">Position is the signal &mdash; task requirements decide the quadrant, not the newest model.</text>
      </svg>
  </div>
</body>
</html>
