<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The original Transformer &middot; Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture &middot; Diagram Design</p>
    <h1>"Attention Is All You Need" &mdash; encoder-decoder stack</h1>

    <svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- Zones (drawn before arrows and nodes) -->
        <rect x="64" y="272" width="272" height="264" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="160" y="276" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="200" y="285" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">ENCODER</text>

        <rect x="644" y="72" width="292" height="464" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="750" y="76" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="790" y="85" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">DECODER</text>

        <!-- Arrows first (behind boxes) -->
        <line x1="200" y1="440" x2="200" y2="392" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="760" y1="440" x2="760" y2="392" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="336" y1="352" x2="676" y2="352" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <line x1="760" y1="320" x2="760" y2="272" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="760" y1="200" x2="760" y2="152" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Arrow label: cross-attention (accent, focal relationship) -->
        <rect x="470" y="330" width="112" height="12" rx="2" fill="#f5f5f5"/>
        <text x="526" y="339" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CROSS-ATTENTION</text>

        <!-- Node: Input Embedding + PE -->
        <rect x="80" y="440" width="240" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="80" y="440" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="200" y="468" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Input Embedding</text>
        <text x="200" y="484" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">+ positional encoding</text>

        <!-- Node: Encoder Block xN (focal) -->
        <rect x="80" y="320" width="240" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="80" y="320" width="240" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <rect x="88" y="328" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
        <text x="102" y="337" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">&times;N</text>
        <text x="200" y="358" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Encoder Block</text>
        <text x="200" y="374" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">self-attn &middot; feed-forward</text>

        <!-- Node: Output Embedding + PE -->
        <rect x="680" y="440" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="680" y="440" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="760" y="468" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Output Embedding</text>
        <text x="760" y="484" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">+ positional encoding</text>

        <!-- Node: Decoder Block xN (focal) -->
        <rect x="680" y="320" width="160" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="680" y="320" width="160" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <rect x="688" y="328" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
        <text x="702" y="337" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">&times;N</text>
        <text x="760" y="358" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Decoder Block</text>
        <text x="760" y="374" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">masked self-attn &middot; cross-attn</text>

        <!-- Node: Linear + Softmax -->
        <rect x="680" y="200" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="680" y="200" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="760" y="228" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Linear + Softmax</text>
        <text x="760" y="244" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">vocab projection</text>

        <!-- Node: Output Probabilities -->
        <rect x="680" y="80" width="160" height="56" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="760" y="112" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Output Probabilities</text>

        <!-- Legend -->
        <line x1="40" y1="552" x2="960" y2="552" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="568" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="580" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <text x="60" y="588" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Stacked block (&times;N)</text>

        <rect x="220" y="580" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="240" y="588" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Embedding / projection</text>

        <line x1="420" y1="586" x2="448" y2="586" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="456" y="588" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Cross-attention link</text>

        <text x="620" y="588" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif" font-style="italic">Each block repeats N times; only one instance is drawn.</text>
      </svg>
  </div>
</body>
</html>
