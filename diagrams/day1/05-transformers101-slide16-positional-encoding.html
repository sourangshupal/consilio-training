<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Positional encoding &middot; Line chart</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Line chart &middot; Diagram Design</p>
    <h1>Sinusoidal positional encoding &mdash; frequency by dimension</h1>

    <svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- Y gridlines: PE value from +1 to -1 -->
        <line x1="80" y1="60"  x2="960" y2="60"  stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
        <line x1="80" y1="145" x2="960" y2="145" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
        <line x1="80" y1="230" x2="960" y2="230" stroke="rgba(45,49,66,0.14)" stroke-width="0.8"/>
        <line x1="80" y1="315" x2="960" y2="315" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
        <line x1="80" y1="400" x2="960" y2="400" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
        <text x="72" y="63"  fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">+1</text>
        <text x="72" y="233" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">0</text>
        <text x="72" y="403" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">-1</text>

        <!-- X axis labels: position index -->
        <text x="80"  y="420" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">0</text>
        <text x="256" y="420" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">10</text>
        <text x="432" y="420" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">20</text>
        <text x="608" y="420" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">30</text>
        <text x="784" y="420" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">40</text>
        <text x="960" y="420" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">50</text>
        <text x="520" y="440" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">SEQUENCE POSITION</text>

        <!-- Series: dim 32 (slowest, series-2) -->
        <polyline points="80.0,230.0 115.2,199.6 150.4,170.4 185.6,143.6 220.8,120.2 256.0,101.3 291.2,87.4 326.4,79.2 361.6,77.1 396.8,81.0 432.0,90.9 467.2,106.3 502.4,126.7 537.6,151.1 572.8,178.7 608.0,208.4 643.2,238.9 678.4,269.1 713.6,297.7 748.8,323.6 784.0,345.8 819.2,363.4 854.4,375.6 889.6,382.0 924.8,382.4 960.0,376.7"
                  fill="none" stroke="#5e7a9b" stroke-width="1.2" stroke-linejoin="round"/>

        <!-- Series: dim 16 (medium, series-1) -->
        <polyline points="80.0,230.0 115.2,139.6 150.4,84.1 185.6,85.1 220.8,142.1 256.0,233.2 291.2,323.0 326.4,376.8 361.6,373.9 396.8,315.3 432.0,223.7 467.2,134.5 502.4,82.3 537.6,87.2 572.8,147.4 608.0,239.5 643.2,327.9 678.4,378.5 713.6,371.6 748.8,309.9 784.0,217.4 819.2,129.7 854.4,80.8 889.6,89.6 924.8,152.8 960.0,245.8"
                  fill="none" stroke="#7c8f6f" stroke-width="1.2" stroke-linejoin="round"/>

        <!-- Series: dim 0 (fastest, focal) -->
        <polyline points="80.0,230.0 97.6,101.3 115.2,90.9 132.8,208.4 150.4,345.8 168.0,376.7 185.6,272.8 203.2,129.5 220.8,78.6 238.4,166.9 256.0,313.2 273.6,383.0 291.2,312.1 308.8,165.7 326.4,78.4 344.0,130.5 361.6,274.0 379.2,377.1 396.8,344.9 414.4,207.1 432.0,90.3 449.6,102.0 467.2,231.4 484.8,359.5 502.4,368.6 520.0,250.2 537.6,113.3 555.2,83.7 572.8,188.6 590.4,331.5 608.0,381.2 625.6,291.8 643.2,145.6 660.8,77.0 678.4,149.1 696.0,295.5 713.6,381.7 731.2,328.5 748.8,184.7 766.4,82.5 784.0,116.0 801.6,254.3 819.2,370.2 836.8,357.3 854.4,227.3 872.0,99.8 889.6,92.0 907.2,211.1 924.8,347.5 942.4,375.9 960.0,270.1"
                  fill="none" stroke="#eb6c36" stroke-width="1.8" stroke-linejoin="round"/>

        <!-- Legend -->
        <line x1="40" y1="452" x2="960" y2="452" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="468" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="480" width="16" height="8" fill="#eb6c36"/>
        <text x="64" y="487" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">dim 0 &middot; high frequency</text>

        <rect x="240" y="480" width="16" height="8" fill="#7c8f6f"/>
        <text x="264" y="487" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">dim 16 &middot; mid frequency</text>

        <rect x="440" y="480" width="16" height="8" fill="#5e7a9b"/>
        <text x="464" y="487" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">dim 32 &middot; low frequency</text>

        <text x="660" y="487" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif" font-style="italic">Each dimension oscillates at its own wavelength.</text>
      </svg>
  </div>
</body>
</html>
