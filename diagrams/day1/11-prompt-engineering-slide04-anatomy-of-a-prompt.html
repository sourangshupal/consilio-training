<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anatomy of a prompt &middot; Layer stack</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Layer stack &middot; Diagram Design</p>
    <h1>Anatomy of a prompt</h1>

    <svg viewBox="0 0 1000 460" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- Direction column (left margin) -->
        <text x="60" y="68" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">SENT FIRST</text>
        <line x1="80" y1="80" x2="80" y2="360" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <polygon points="76,80 84,80 80,72" fill="#4f5d75"/>
        <text x="60" y="376" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">SENT LAST</text>

        <!-- Stack hairlines -->
        <line x1="120" y1="80" x2="960" y2="80" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
        <line x1="120" y1="360" x2="960" y2="360" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>

        <!-- L1 - Instruction (focal) -->
        <rect x="120" y="80" width="840" height="70" fill="rgba(235,108,54,0.08)"/>
        <rect x="120" y="80" width="840" height="70" fill="none" stroke="#eb6c36" stroke-width="1"/>
        <text x="140" y="112" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em" font-weight="600">L1</text>
        <text x="260" y="114" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Instruction</text>
        <text x="260" y="132" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace">"Summarize the indemnification clause in plain English."</text>

        <!-- L2 - Context -->
        <rect x="120" y="150" width="840" height="70" fill="#ffffff"/>
        <line x1="120" y1="220" x2="960" y2="220" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
        <text x="140" y="182" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L2</text>
        <text x="260" y="184" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Context</text>
        <text x="260" y="202" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace">"You are a contract analyst reviewing a services agreement."</text>

        <!-- L3 - Input -->
        <rect x="120" y="220" width="840" height="70" fill="#ececec"/>
        <line x1="120" y1="290" x2="960" y2="290" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
        <text x="140" y="252" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L3</text>
        <text x="260" y="254" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Input</text>
        <text x="260" y="272" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace">"Section 7.1: The Contractor shall indemnify, defend&#8230;"</text>

        <!-- L4 - Output Format -->
        <rect x="120" y="290" width="840" height="70" fill="#f5f5f5"/>
        <text x="140" y="322" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L4</text>
        <text x="260" y="324" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Output Format</text>
        <text x="260" y="342" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace">"Respond in 2 bullet points, no legal jargon."</text>

        <!-- Caption -->
        <text x="120" y="416" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">FOCAL SECTION</text>
        <text x="260" y="416" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif" font-style="italic">The instruction anchors everything below it &mdash; get this section wrong and no amount of context fixes it.</text>
      </svg>
  </div>
</body>
</html>
