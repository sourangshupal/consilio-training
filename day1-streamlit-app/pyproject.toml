[project]
name = "day1-streamlit-app"
version = "0.1.0"
description = "Day 1 AI Foundations — interactive Streamlit companion to the day1 notebooks"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.38.0",
    "transformers>=4.44.0",
    "torch>=2.4.0",
    "matplotlib>=3.9.0",
    "numpy>=1.26.0",
    "accelerate>=0.33.0",
    "openai>=1.40.0",
    "google-genai>=1.0.0",
    "groq>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
